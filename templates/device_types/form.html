{% extends "base.html" %}

{% block title %}{{ 'Sửa' if device_type else 'Thêm' }} Loại thiết bị{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title mb-0">{{ 'Sửa' if device_type else 'Thêm' }} Loại thiết bị</h2>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-8">
                    <div class="mb-3">
                        <label class="form-label required">Tên loại thiết bị</label>
                        <input type="text" name="name" class="form-control"
                            value="{{ device_type.name if device_type else '' }}"
                            placeholder="VD: Laptop, Màn hình, Máy in..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required">Mã loại thiết bị</label>
                        <input type="text" name="code_prefix" class="form-control text-uppercase"
                            value="{{ device_type.code_prefix if device_type and device_type.code_prefix else '' }}"
                            placeholder="VD: BP, MH, LT" maxlength="20" pattern="[A-Za-z0-9]+"
                            title="Chỉ dùng chữ cái A-Z và số" required>
                        <div class="form-text">Dùng để tự sinh mã thiết bị, ví dụ BP-001, MH-001.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required">Nhóm thiết bị</label>
                        <select name="category" class="form-select" required>
                            <option value="">-- Chọn nhóm --</option>
                            {% for cat in device_type_categories %}
                            <option value="{{ cat }}" {% if device_type and device_type.category==cat %}selected{% endif
                                %}>{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea name="description" class="form-control"
                            rows="3">{{ device_type.description if device_type else '' }}</textarea>
                    </div>
                </div>
            </div>

            <div class="form-group mt-3">
                <a href="{{ url_for('device_type_list') }}" class="btn btn-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary">Lưu lại</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
