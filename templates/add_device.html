{% extends "base.html" %}

{% block title %}Thêm Thiết Bị Mới{% endblock %}

{% block content %}
<style>
    .device-entry-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: .5rem;
    }
    .device-entry-grid .wide,
    .device-image-cell {
        grid-column: 1 / -1;
    }
    .device-config-label {
        align-items: center;
        display: flex;
        gap: .5rem;
        justify-content: space-between;
    }
    .device-config-area {
        align-items: start;
        display: grid;
        gap: .5rem;
        grid-template-columns: minmax(260px, 1fr) minmax(360px, 1fr);
    }
    .device-spec-panel {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        padding: .5rem;
    }
    .device-image-preview {
        display: flex;
        flex-wrap: wrap;
        gap: .375rem;
        margin-top: .375rem;
    }
    .device-image-preview img {
        border: 1px solid #dee2e6;
        border-radius: 4px;
        height: 56px;
        object-fit: cover;
        width: 72px;
    }
    .device-image-cell .form-text {
        font-size: .72rem;
    }
    @media (max-width: 1200px) {
        .device-entry-grid {
            grid-template-columns: repeat(2, minmax(150px, 1fr));
        }
        .device-config-area {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="card-title mb-0">Thêm Thiết Bị Mới</h2>
            <button type="button" id="add-device-row" class="btn btn-outline-success">
                <i class="bi bi-plus-lg"></i> Thêm dòng
            </button>
        </div>

        <form method="POST" id="add-device-form" enctype="multipart/form-data">
            <div class="card mb-3">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Thông tin mua sắm và quản lý</h5>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label required">Ngày mua</label>
                            <input type="date" name="purchase_date" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Người mua</label>
                            <input type="text" name="buyer" class="form-control">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Nhà cung cấp</label>
                            <input type="text" name="supplier" class="form-control" placeholder="VD: FPT, Phong Vũ">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label required">Trạng thái</label>
                            <select name="status" class="form-select" required>
                                <option value="Sẵn sàng" selected>Sẵn sàng</option>
                                <option value="Đã cấp phát">Đã cấp phát</option>
                                <option value="Bảo trì">Bảo trì</option>
                                <option value="Hỏng">Hỏng</option>
                                <option value="Thanh lý">Thanh lý</option>
                                <option value="Test">Test</option>
                                <option value="Mượn">Mượn</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Người quản lý ban đầu</label>
                            <select name="manager_id" class="form-select">
                                <option value="">-- Chọn --</option>
                                {% for manager in managers %}
                                <option value="{{ manager.id }}">{{ manager.full_name or manager.username }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Ngày cấp phát ban đầu</label>
                            <input type="date" name="assign_date" class="form-control">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Thông tin chi tiết từng thiết bị</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead class="table-light text-center">
                                <tr>
                                    <th style="width: 42px;">#</th>
                                    <th>Thông tin thiết bị</th>
                                    <th style="width: 110px;">Số lượng</th>
                                    <th style="width: 190px;">Ghi chú</th>
                                    <th style="width: 64px;">Xóa</th>
                                </tr>
                            </thead>
                            <tbody id="device-rows"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="form-group mt-3">
                <a href="{{ url_for('device_list') }}" class="btn btn-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary">Lưu thiết bị</button>
            </div>
        </form>
    </div>
</div>

<template id="device-row-template">
    <tr class="device-row device-row-main">
        <td class="text-center fw-bold row-number">1</td>
        <td>
            <div class="device-entry-grid">
                <div>
                    <label class="form-label small mb-1">Tên thiết bị</label>
                    <input type="text" name="name[]" class="form-control form-control-sm" required>
                </div>
                <div>
                    <label class="form-label small mb-1">Loại thiết bị</label>
                    <select name="device_type[]" class="form-select form-select-sm" required>
                        <option value="">-- Chọn loại --</option>
                        {% for category, types in grouped_device_types.items() %}
                        <optgroup label="{{ category }}">
                            {% for type in types %}
                            <option value="{{ type.name }}">{{ type.name }}</option>
                            {% endfor %}
                        </optgroup>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="form-label small mb-1">Mã TB</label>
                    <input type="text" name="device_code[]" class="form-control form-control-sm" placeholder="Để trống tự tạo">
                </div>
                <div>
                    <label class="form-label small mb-1">Bảo hành</label>
                    <input type="text" name="warranty[]" class="form-control form-control-sm" placeholder="VD: 12 tháng">
                </div>
                <div>
                    <label class="form-label small mb-1">Thương hiệu</label>
                    <input type="text" name="brand[]" class="form-control form-control-sm" placeholder="VD: Dell, HP">
                </div>
                <div>
                    <label class="form-label small mb-1">Số serial</label>
                    <input type="text" name="serial_number[]" class="form-control form-control-sm">
                </div>
                <div>
                    <label class="form-label small mb-1">Giá mua</label>
                    <input type="number" step="1000" name="purchase_price[]" class="form-control form-control-sm" placeholder="VD: 15000000">
                </div>
                <div class="wide">
                    <div class="device-config-label">
                        <label class="form-label small mb-1">Cấu hình / thông tin khác</label>
                        <button type="button" class="btn btn-sm btn-outline-primary toggle-spec-row d-none" title="Mở rộng cấu hình">
                            <i class="bi bi-sliders"></i>
                        </button>
                    </div>
                    <div class="device-config-area">
                        <textarea name="configuration[]" class="form-control form-control-sm" rows="3"
                            placeholder="VD: card mạng, linh kiện khác, thông số bổ sung"></textarea>
                        <div class="device-spec-panel d-none">
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">Chip / CPU</label>
                                    <input type="text" name="cpu[]" class="form-control form-control-sm" placeholder="Intel Core i5-12400">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">Main</label>
                                    <input type="text" name="mainboard[]" class="form-control form-control-sm" placeholder="MSI H610">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">RAM</label>
                                    <input type="text" name="ram_gb[]" class="form-control form-control-sm" placeholder="16GB DDR4">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">SSD</label>
                                    <input type="text" name="ssd[]" class="form-control form-control-sm" placeholder="500GB NVMe">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">HDD</label>
                                    <input type="text" name="hdd[]" class="form-control form-control-sm" placeholder="1TB">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small mb-1">VGA</label>
                                    <input type="text" name="vga[]" class="form-control form-control-sm" placeholder="RTX 3060">
                                </div>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" name="condition[]" value="Sử dụng bình thường">
                </div>
                <div class="device-image-cell">
                    <label class="form-label small mb-1">Ảnh thiết bị</label>
                    <input type="file" class="form-control form-control-sm device-image-input" accept="image/*" multiple>
                    <div class="form-text">Tối đa 5 ảnh</div>
                    <div class="device-image-preview"></div>
                </div>
            </div>
        </td>
        <td>
            <input type="number" name="quantity[]" class="form-control form-control-sm text-center fw-bold" min="1" step="1" value="1">
        </td>
        <td><textarea name="notes[]" class="form-control form-control-sm" rows="3"></textarea></td>
        <td class="text-center">
            <button type="button" class="btn btn-sm btn-outline-danger remove-device-row" title="Xóa dòng">
                <i class="bi bi-trash"></i>
            </button>
        </td>
    </tr>
</template>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function () {
    const rows = document.getElementById('device-rows');
    const template = document.getElementById('device-row-template');
    const addButton = document.getElementById('add-device-row');

    function isConfigurableType(value) {
        const text = (value || '').toLowerCase();
        return text.includes('case') || text.includes('laptop');
    }

    function updateRowNumbers() {
        rows.querySelectorAll('.device-row-main').forEach((row, index) => {
            row.querySelector('.row-number').textContent = index + 1;
            const imageInput = row.querySelector('.device-image-input');
            if (imageInput) {
                imageInput.name = `device_images_${index}[]`;
            }
        });
    }

    function syncSpecToggle(mainRow) {
        const typeSelect = mainRow.querySelector('[name="device_type[]"]');
        const toggleButton = mainRow.querySelector('.toggle-spec-row');
        const specPanel = mainRow.querySelector('.device-spec-panel');
        const canConfigure = isConfigurableType(typeSelect.value);
        toggleButton.classList.toggle('d-none', !canConfigure);
        if (!canConfigure && specPanel) {
            specPanel.classList.add('d-none');
            specPanel.querySelectorAll('input').forEach(input => {
                input.value = '';
            });
        }
    }

    function renderImagePreview(input) {
        const preview = input.closest('.device-image-cell').querySelector('.device-image-preview');
        preview.innerHTML = '';
        const files = Array.from(input.files || []);
        if (files.length > 5) {
            alert('Mỗi thiết bị chỉ được chọn tối đa 5 ảnh.');
            input.value = '';
            return;
        }
        files.forEach(file => {
            const url = URL.createObjectURL(file);
            const img = document.createElement('img');
            img.src = url;
            img.alt = 'Ảnh thiết bị';
            preview.appendChild(img);
        });
        if (files.length) {
            const clearButton = document.createElement('button');
            clearButton.type = 'button';
            clearButton.className = 'btn btn-sm btn-outline-danger clear-device-image';
            clearButton.title = 'Bỏ ảnh';
            clearButton.innerHTML = '<i class="bi bi-x-lg"></i>';
            preview.appendChild(clearButton);
        }
    }

    function addRow() {
        const clone = template.content.cloneNode(true);
        rows.appendChild(clone);
        const mainRows = rows.querySelectorAll('.device-row-main');
        const mainRow = mainRows[mainRows.length - 1];
        if (mainRow) {
            syncSpecToggle(mainRow);
        }
        updateRowNumbers();
    }

    addButton.addEventListener('click', addRow);
    rows.addEventListener('change', function (event) {
        if (event.target.matches('[name="device_type[]"]')) {
            syncSpecToggle(event.target.closest('.device-row-main'));
        }
        if (event.target.matches('.device-image-input')) {
            renderImagePreview(event.target);
        }
    });

    rows.addEventListener('click', function (event) {
        const toggleButton = event.target.closest('.toggle-spec-row');
        if (toggleButton) {
            const mainRow = toggleButton.closest('.device-row-main');
            const specPanel = mainRow.querySelector('.device-spec-panel');
            if (specPanel) {
                specPanel.classList.toggle('d-none');
            }
            return;
        }
        const clearImageButton = event.target.closest('.clear-device-image');
        if (clearImageButton) {
            const cell = clearImageButton.closest('.device-image-cell');
            const input = cell.querySelector('.device-image-input');
            input.value = '';
            cell.querySelector('.device-image-preview').innerHTML = '';
            return;
        }
        const button = event.target.closest('.remove-device-row');
        if (!button) return;
        const allRows = rows.querySelectorAll('.device-row-main');
        if (allRows.length <= 1) {
            return;
        }
        button.closest('.device-row-main').remove();
        updateRowNumbers();
    });

    document.getElementById('add-device-form').addEventListener('submit', function (event) {
        updateRowNumbers();
        const names = Array.from(rows.querySelectorAll('[name="name[]"]')).map(input => input.value.trim()).filter(Boolean);
        if (!names.length) {
            event.preventDefault();
            alert('Vui lòng nhập ít nhất một thiết bị.');
        }
    });

    addRow();
});
</script>
{% endblock %}
