{% extends 'base.html' %}
{% block title %}Tạo đề xuất thiết bị{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Tạo đề xuất thiết bị</h3>
  <a href="{{ url_for('config_proposals') }}" class="btn btn-secondary">Quay lại</a>
</div>

<form method="post">
  <div class="card mb-3">
    <div class="card-header bg-light">
      <strong>Thông tin yêu cầu</strong>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label required">Tên đề xuất</label>
          <input type="text" class="form-control" name="name" placeholder="VD: Mua máy tính cho nhân sự mới" required>
        </div>
        <div class="col-md-3">
          <label class="form-label required">Ngày đề xuất</label>
          <input type="date" class="form-control" name="proposal_date" value="{{ default_date }}" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Phạm vi</label>
          <select class="form-select" name="scope">
            <option value="Cá nhân">Cá nhân</option>
            <option value="Dùng chung">Dùng chung</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label required">Người đề xuất</label>
          <select class="form-select select2" name="proposer_name" id="proposer_select" required>
            {% for u in users %}
            <option value="{{ u.full_name or u.username }}" data-unit="{{ u.department_info.name if u.department_info else '' }}"
              {% if u.id==current_user.id %}selected{% endif %}>{{ u.full_name or u.username }} ({{ u.username }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Đơn vị đề xuất</label>
          <input type="text" class="form-control" name="proposer_unit" readonly>
        </div>
        <div class="col-md-3">
          <label class="form-label">Thời hạn cần thiết bị</label>
          <input type="date" class="form-control" name="required_date">
        </div>
        <div class="col-md-3">
          <label class="form-label">Mức độ ưu tiên</label>
          <select class="form-select" name="priority">
            <option value="Thấp">Thấp</option>
            <option value="Trung bình" selected>Trung bình</option>
            <option value="Cao">Cao</option>
            <option value="Khẩn cấp">Khẩn cấp</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Số lượng bộ</label>
          <input type="number" class="form-control" name="quantity" value="1" min="1">
        </div>
        <div class="col-md-3">
          <label class="form-label">Loại tiền dự kiến</label>
          <select class="form-select" name="currency">
            <option value="VND" selected>VND</option>
            <option value="USD">USD</option>
            <option value="EURO">EURO</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label required">Nhu cầu sử dụng</label>
          <textarea class="form-control" rows="4" name="general_requirements"
            placeholder="Mô tả nhu cầu: công việc cần dùng, phần mềm cần chạy, yêu cầu màn hình/phụ kiện, ngân sách mong muốn..."
            required></textarea>
        </div>
        <div class="col-12">
          <label class="form-label">Ghi chú</label>
          <textarea class="form-control" rows="2" name="notes"></textarea>
        </div>
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Gửi đề xuất</button>
  <a href="{{ url_for('config_proposals') }}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}

{% block scripts %}
<script>
  $(document).ready(function () {
    $('#proposer_select').select2({ theme: 'bootstrap-5' });

    function updateUnit() {
      var unit = $('#proposer_select').find(':selected').data('unit');
      $('input[name="proposer_unit"]').val(unit || '');
    }

    $('#proposer_select').on('change', updateUnit);
    updateUnit();
  });
</script>
{% endblock %}
