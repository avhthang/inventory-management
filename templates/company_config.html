{% extends "base.html" %}

{% block title %}Cấu hình Thông tin Công ty{% endblock %}

{% block content %}
<div class="container py-3" style="max-width: 750px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-building"></i> Cấu hình Thông tin Công ty / Chi nhánh</h3>
        <a href="{{ url_for('stock_item_list') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="text-muted mb-3">Thông tin này sẽ hiển thị ở phần tiêu đề trên các Phiếu nhập kho, Phiếu xuất kho và Phiếu bàn giao thiết bị.</div>

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold required">Tên Công ty / Đơn vị chính</label>
                    <input type="text" class="form-control" name="company_name" value="{{ cfg.company_name }}" required placeholder="VD: CÔNG TY CỔ PHẦN THIẾT BỊ & CÔNG NGHỆ">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold required">Chi nhánh / Phòng ban xuất</label>
                    <input type="text" class="form-control" name="branch_name" value="{{ cfg.branch_name }}" required placeholder="VD: Chi nhánh TP.HCM - Phòng IT & Vật tư">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Địa chỉ trụ sở / kho</label>
                    <input type="text" class="form-control" name="company_address" value="{{ cfg.company_address }}" placeholder="VD: 123 Đường ABC, Phường X, Quận Y, TP.HCM">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Số điện thoại liên hệ</label>
                    <input type="text" class="form-control" name="company_phone" value="{{ cfg.company_phone }}" placeholder="VD: 028 1234 5678">
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
