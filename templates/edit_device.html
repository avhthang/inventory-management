{% extends "base.html" %}

{% block title %}Chỉnh sửa Thiết Bị{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2 class="card-title">Chỉnh sửa Thiết Bị: {{ device.name }}</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label required">Mã thiết bị</label>
                        <input type="text" name="device_code" class="form-control" value="{{ device.device_code }}"
                            required>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label required">Tên thiết bị</label>
                        <input type="text" name="name" class="form-control" value="{{ device.name }}" required>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label required">Loại thiết bị</label>
                        <select name="device_type" class="form-control" required>
                            <option value="">-- Chọn --</option>
                            {% if grouped_device_types %}
                            {% for category, types in grouped_device_types.items() %}
                            <optgroup label="{{ category }}">
                                {% for type in types %}
                                <option value="{{ type.name }}" {% if device.device_type==type.name %}selected{% endif
                                    %}>{{ type.name }}</option>
                                {% endfor %}
                            </optgroup>
                            {% endfor %}
                            {% else %}
                            <!-- Fallback if no types in DB -->
                            <option value="Laptop" {% if device.device_type=='Laptop' %}selected{% endif %}>Laptop
                            </option>
                            <option value="Case máy tính" {% if device.device_type=='Case máy tính' %}selected{% endif
                                %}>Case máy tính</option>
                            {% endif %}
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Số serial</label>
                        <input type="text" name="serial_number" class="form-control"
                            value="{{ device.serial_number or '' }}">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Thương hiệu</label>
                        <input type="text" name="brand" class="form-control" value="{{ device.brand or '' }}"
                            placeholder="VD: Dell, HP, Apple">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Nhà cung cấp</label>
                        <input type="text" name="supplier" class="form-control" value="{{ device.supplier or '' }}"
                            placeholder="VD: FPT, Phong Vũ">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Bảo hành</label>
                        <input type="text" name="warranty" class="form-control" value="{{ device.warranty or '' }}"
                            placeholder="VD: 12 tháng, 36 tháng">
                    </div>
                    <div id="pc-spec-fields" class="border rounded p-3 mb-3 bg-light" style="display: none;">
                        <h6 class="mb-3">Cấu hình Case PC</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">CPU</label>
                                    <input type="text" name="cpu" class="form-control"
                                        value="{{ device.cpu or '' }}" placeholder="VD: Intel Core i5-12400">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">RAM (GB)</label>
                                    <input type="number" min="0" step="1" name="ram_gb" class="form-control"
                                        value="{{ device.ram_gb or '' }}" placeholder="VD: 16">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">SSD</label>
                                    <input type="text" name="ssd" class="form-control"
                                        value="{{ device.ssd or '' }}" placeholder="VD: 512GB NVMe">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">HDD</label>
                                    <input type="text" name="hdd" class="form-control"
                                        value="{{ device.hdd or '' }}" placeholder="VD: 1TB">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">VGA</label>
                                    <input type="text" name="vga" class="form-control"
                                        value="{{ device.vga or '' }}" placeholder="VD: GTX 1660">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group mb-3">
                                    <label class="form-label">Card Wi-Fi</label>
                                    <input type="text" name="wifi_card" class="form-control"
                                        value="{{ device.wifi_card or '' }}" placeholder="VD: Intel AX200">
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group mb-0">
                                    <label class="form-label">Card mạng</label>
                                    <input type="text" name="network_card" class="form-control"
                                        value="{{ device.network_card or '' }}" placeholder="VD: Realtek 1GbE">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Cấu hình chi tiết</label>
                        <textarea name="configuration" class="form-control"
                            rows="2">{{ device.configuration or '' }}</textarea>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Ảnh thiết bị</label>
                        {% if device.image_filename %}
                        <div class="mb-2">
                            <img src="{{ url_for('static', filename='uploads/devices/' + device.image_filename) }}"
                                alt="Ảnh thiết bị {{ device.device_code }}" class="img-thumbnail"
                                style="max-height: 180px; object-fit: contain;">
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="remove_device_image" value="1"
                                id="removeDeviceImage">
                            <label class="form-check-label" for="removeDeviceImage">Xóa ảnh hiện tại</label>
                        </div>
                        {% endif %}
                        <input type="file" name="device_image" class="form-control" accept="image/*">
                        <div class="form-text">Không bắt buộc. Chọn ảnh mới sẽ thay ảnh hiện tại.</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group mb-3">
                        <label class="form-label required">Ngày mua</label>
                        <input type="date" name="purchase_date" class="form-control"
                            value="{{ device.purchase_date.strftime('%Y-%m-%d') if device.purchase_date else '' }}"
                            required>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Giá mua (VND)</label>
                        <input type="number" step="1000" name="purchase_price" class="form-control"
                            value="{{ device.purchase_price or '' }}" placeholder="Chỉ nhập số, VD: 15000000">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Người mua</label>
                        <input type="text" name="buyer" class="form-control" value="{{ device.buyer or '' }}">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label required">Tình trạng</label>
                        <select name="condition" class="form-control" required>
                            <option value="Mới" {% if device.condition=='Mới' %}selected{% endif %}>Mới</option>
                            <option value="Sử dụng bình thường" {% if device.condition=='Sử dụng bình thường'
                                %}selected{% endif %}>Sử dụng bình thường</option>
                            <option value="Cần bảo trì" {% if device.condition=='Cần bảo trì' %}selected{% endif %}>Cần
                                bảo trì</option>
                            <option value="Hỏng" {% if device.condition=='Hỏng' %}selected{% endif %}>Hỏng</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label required">Trạng thái</label>
                        <select name="status" class="form-control" required>
                            <option value="Sẵn sàng" {% if device.status=='Sẵn sàng' %}selected{% endif %}>Sẵn sàng
                            </option>
                            <option value="Đã cấp phát" {% if device.status=='Đã cấp phát' %}selected{% endif %}>Đã cấp
                                phát</option>
                            <option value="Bảo trì" {% if device.status=='Bảo trì' %}selected{% endif %}>Bảo trì
                            </option>
                            <option value="Hỏng" {% if device.status=='Hỏng' %}selected{% endif %}>Hỏng</option>
                            <option value="Thanh lý" {% if device.status=='Thanh lý' %}selected{% endif %}>Thanh lý
                            </option>
                            <option value="Test" {% if device.status=='Test' %}selected{% endif %}>Test</option>
                            <option value="Mượn" {% if device.status=='Mượn' %}selected{% endif %}>Mượn</option>
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Người sử dụng</label>
                        <select name="manager_id" class="form-control">
                            <option value="">-- Bỏ chọn --</option>
                            {% for manager in managers %}<option value="{{ manager.id }}" {% if
                                device.manager_id==manager.id %}selected{% endif %}>{{ manager.full_name }}</option>{%
                            endfor %}
                        </select>
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Ngày cấp phát</label>
                        <input type="date" name="assign_date" class="form-control"
                            value="{{ device.assign_date.strftime('%Y-%m-%d') if device.assign_date else '' }}">
                    </div>
                    <div class="form-group mb-3">
                        <label class="form-label">Ghi chú</label>
                        <textarea name="notes" class="form-control" rows="2">{{ device.notes or '' }}</textarea>
                    </div>
                </div>
            </div>
            <div class="form-group mt-3">
                <a href="{{ url_for('device_list') }}" class="btn btn-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function () {
    const typeSelect = document.querySelector('select[name="device_type"]');
    const pcFields = document.getElementById('pc-spec-fields');
    const isPcType = function (value) {
        const text = (value || '').toLowerCase();
        return text.includes('case') || text.includes('pc') || text.includes('desktop') || text.includes('máy tính');
    };
    const togglePcFields = function () {
        pcFields.style.display = isPcType(typeSelect.value) ? '' : 'none';
    };
    typeSelect.addEventListener('change', togglePcFields);
    togglePcFields();
});
</script>
{% endblock %}
