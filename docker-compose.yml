

services:
  inventory-app:
    container_name: inventory-app
    build:
      context: ${INVENTORY_APP_DIR:-.}
    env_file:
      - ${INVENTORY_ENV_FILE:-/opt/docker/secrets/inventory/inventory.env}
    environment:
      FLASK_ENV: production
      INVENTORY_INSTANCE_DIR: /app/instance
      INVENTORY_BACKUP_DIR: /app/backups
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-https}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - ${INVENTORY_DATA_DIR:-/srv/inventory/data}/instance:/app/instance
      - ${INVENTORY_DATA_DIR:-/srv/inventory/data}/logs:/app/logs
      - ${INVENTORY_DATA_DIR:-/srv/inventory/data}/backups:/app/backups
      - static_data:/app/static
    depends_on:
      inventory-postgres:
        condition: service_healthy
    networks:
      - inventory-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  inventory-postgres:
    container_name: inventory-postgres
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_pass}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c max_logical_replication_workers=4
        -c max_worker_processes=10
    volumes:
      - ${POSTGRES_DATA_DIR:-/srv/postgres/inventory/data}:/var/lib/postgresql/data
    networks:
      - inventory-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-nginx:
    container_name: inventory-nginx
    image: nginx:alpine
    ports:
      - "${INVENTORY_HTTP_BIND:-127.0.0.1}:${INVENTORY_HTTP_PORT:-8088}:80"
      - "${INVENTORY_HTTPS_BIND:-127.0.0.1}:${INVENTORY_HTTPS_PORT:-8443}:443"
    volumes:
      - ${INVENTORY_NGINX_CONF:-/opt/docker/configs/inventory/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${INVENTORY_SSL_DIR:-/opt/docker/configs/inventory/ssl}:/etc/nginx/ssl
      - ${INVENTORY_INIT_SSL:-/opt/docker/scripts/inventory/init-ssl.sh}:/docker-entrypoint-init-ssl.sh:ro
      - static_data:/app/static
    depends_on:
      - inventory-app
    networks:
      - inventory-internal
    restart: unless-stopped
    entrypoint: >
      sh -c "
      if [ -f /docker-entrypoint-init-ssl.sh ]; then
        sh /docker-entrypoint-init-ssl.sh
      fi &&
      exec /docker-entrypoint.sh nginx -g 'daemon off;'
      "

  inventory-redis:
    container_name: inventory-redis
    image: redis:7-alpine
    volumes:
      - ${REDIS_DATA_DIR:-/srv/redis/inventory/data}:/data
    networks:
      - inventory-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  static_data:
    name: inventory-static-data

networks:
  inventory-internal:
    name: inventory-internal
