

services:
  app:
    build:
      context: ${INVENTORY_APP_DIR:-.}
    env_file:
      - path: ${INVENTORY_ENV_FILE:-.env}
        required: false
    environment:
      FLASK_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://inventory_user:inventory_pass@db:5432/inventory_db}
      INVENTORY_INSTANCE_DIR: /app/instance
      INVENTORY_BACKUP_DIR: /app/backups
      PREFERRED_URL_SCHEME: ${PREFERRED_URL_SCHEME:-https}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    volumes:
      - ${INVENTORY_DATA_DIR:-./data/inventory}/instance:/app/instance
      - ${INVENTORY_DATA_DIR:-./data/inventory}/logs:/app/logs
      - ${INVENTORY_DATA_DIR:-./data/inventory}/backups:/app/backups
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_pass}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "${INVENTORY_HTTP_BIND:-127.0.0.1}:${INVENTORY_HTTP_PORT:-8088}:80"
      - "${INVENTORY_HTTPS_BIND:-127.0.0.1}:${INVENTORY_HTTPS_PORT:-8443}:443"
    volumes:
      - ${INVENTORY_NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${INVENTORY_SSL_DIR:-./data/inventory/ssl}:/etc/nginx/ssl
      - ${INVENTORY_INIT_SSL:-./init-ssl.sh}:/docker-entrypoint-init-ssl.sh:ro
      - static_data:/app/static
    depends_on:
      - app
    restart: unless-stopped
    entrypoint: >
      sh -c "
      if [ -f /docker-entrypoint-init-ssl.sh ]; then
        sh /docker-entrypoint-init-ssl.sh
      fi &&
      exec /docker-entrypoint.sh nginx -g 'daemon off;'
      "

  redis:
    image: redis:7-alpine
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  static_data:
